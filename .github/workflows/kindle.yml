name: Kindle edition

# Backup sender, by hand only. Normally Mail on Jack's Mac sends the Kindle edition (see EDITION.md).
# Needs the SMTP_PASSWORD secret (a Gmail app password) to actually send.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: kindle

jobs:
  kindle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send
        run: python kindle.py
        env:
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      - name: Remember when it was sent
        run: |
          git config user.name "top-picks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/kindle_last.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Kindle edition sent"
          git pull --rebase -q && git push
