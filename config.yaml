# Top Picks settings. Edit freely; changes apply on the next run.

opml: feeds.opml
site_url: https://jackrichins.github.io/top-picks
model: claude-haiku-5-5        # fast and cheap; use claude-sonnet-5-5 for sharper judgment
batch_size: 30

lookback_hours: 48             # ignore items older than this when first seen
keep_days: 7                   # how long a pick stays in the output feeds

articles:
  min_score: 7                 # raise to 8 for fewer, better picks
  max_per_run: 12              # aim for 8 to 12 per edition; this is the ceiling

podcasts:
  enabled: false               # true = also build docs/top-podcasts.xml for Overcast
  folder: Podcasts             # the OPML folder that holds your podcasts
  min_score: 7
  max_per_run: 6
  artwork:                     # optional square image URL for the podcast feed

# Kindle edition: sent with the weekday evening and weekend editions (no audio or video)
kindle:
  enabled: true
  title: The Richins Reader
  sasquatch: true               # a Sasquatch reading the paper in the cover scene
  tagline: Only the good stuff, delivered by dinner
  place: Bothell, Wash.
  start_date: 2026-10-30         # issue No. 1; numbers count up from here
  timezone: America/Los_Angeles
  window_hours: 24             # first edition only; after that, everything since the last edition
  min_articles: 3              # skip the edition on very quiet days
  max_articles: 25
  images: true                 # embedded from each article's page, up to max_images each
  max_images: 10
  # Reeder's Later tag as a Shared Feed (JSON feed URL from Reeder: right-click Later > Share)
  later_feeds: []
  later_section: Saved for Later
  later_max: 15                # most Later articles per edition
  later_first_days: 7          # first edition only: include Later saves from the last week
  # Links to these sites become plain text (the Kindle browser can't load them).
  # Links to other web pages are kept.
  strip_link_hosts: [youtube.com, youtu.be, vimeo.com, x.com, twitter.com, t.co, instagram.com,
                     facebook.com, fb.com, tiktok.com, threads.net, threads.com, bsky.app, linkedin.com,
                     reddit.com, spotify.com, open.spotify.com, podcasts.apple.com, music.apple.com,
                     apps.apple.com, overcast.fm, pca.st, twitch.tv]
  # Sections in reading order, each listing the OPML folders it holds.
  # Anything not listed goes in other_section.
  sections:
    Security: [Security]
    Apple: [Apple]
    Tech and Work: [AI, Programming, PM, Microsoft]
    Ideas: [Improvement, Misc]
    News and Science: [News, Science]
    Life and Leisure: [Rivian, Adventure, Photography, History, Sports, Church, Personal, Comedy]
  other_section: More

# Titles matching any of these are dropped before scoring (case-insensitive regex)
skip_title_patterns:
  - "\\bsponsor(ed|ship)?\\b"   # (Sponsor), [Sponsor], Sponsored, Sponsorship Openings
  - "\\bpaid post\\b"

# Summaries whose first lines match these are dropped too (sponsor thank-you posts)
skip_summary_patterns:
  - "thanks to .{1,60} for sponsoring"
  - "^sponsored by"

# Feeds that always get through, no scoring (exact titles from feeds.opml)
always_include:
  - Dan Carlin's Hardcore History
  - "Dan Carlin's Hardcore History: Addendum"
  - Hypercritical
  - xkcd.com
  - Cliff Mass Weather Blog

# Whole folders that always get through
always_include_folders:
  - Personal

# Feeds to ignore entirely
exclude:
  - British History Podcast Member's Only   # private feed; keep this one subscribed directly
